<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA — Neural Interface</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --c:    #00e5ff;   /* primary cyan */
    --c2:   #0099cc;
    --c3:   #003344;
    --bg:   #020c18;
    --text: #7ab8cc;
    --font: 'Courier New', 'Lucida Console', monospace;
    --rec:  #ff2233;
    --think:#ffaa00;
    --speak:#00ff99;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
  }

  /* ── Atmospheric background ──────────────────────────────────── */
  #atmo {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 58%, rgba(0,120,180,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 50% 58%, rgba(0,200,255,0.10) 0%, transparent 55%),
      linear-gradient(180deg, #020c18 0%, #030f1e 100%);
    animation: atmoPulse 5s ease-in-out infinite;
  }
  @keyframes atmoPulse { 0%,100%{opacity:0.8} 50%{opacity:1} }

  /* Dot grid */
  #atmo::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(0,229,255,0.12) 1px, transparent 1px);
    background-size: 44px 44px;
    animation: gridDrift 80s linear infinite;
  }
  @keyframes gridDrift { 0%{background-position:0 0} 100%{background-position:44px 44px} }

  /* Scanlines */
  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 998;
    background: repeating-linear-gradient(
      to bottom, transparent 0, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
    animation: scan 10s linear infinite;
  }
  @keyframes scan { 0%{background-position:0 0} 100%{background-position:0 80px} }

  /* ── Lines canvas (connecting lines) ────────────────────────── */
  #lines-canvas {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 2;
  }

  /* ── Top bar ─────────────────────────────────────────────────── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 46px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px;
    border-bottom: 1px solid rgba(0,229,255,0.12);
    background: linear-gradient(180deg, rgba(0,30,50,0.8) 0%, transparent 100%);
    z-index: 20;
  }
  #logo {
    font-size: 14px; letter-spacing: 9px; font-weight: bold;
    color: var(--c); text-shadow: 0 0 18px rgba(0,229,255,0.7);
  }
  #topbar-mid { font-size: 9px; letter-spacing: 3px; color: rgba(0,229,255,0.28); }
  #topbar-right { text-align: right; line-height: 1.6; }
  #clock { font-size: 15px; letter-spacing: 3px; color: var(--c); text-shadow: 0 0 12px rgba(0,229,255,0.5); }
  #datestr { font-size: 9px; letter-spacing: 2px; color: rgba(0,229,255,0.4); }

  /* ── Corner decorations ──────────────────────────────────────── */
  .corner { position: fixed; width: 48px; height: 48px; z-index: 10; opacity: 0.4; }
  .corner::before, .corner::after { content:''; position:absolute; background:var(--c); }
  .corner::before { width:2px; height:28px; }
  .corner::after  { width:28px; height:2px; }
  .corner-tl { top:16px; left:16px; } .corner-tl::before{top:0;left:0} .corner-tl::after{top:0;left:0}
  .corner-tr { top:16px; right:16px;} .corner-tr::before{top:0;right:0}.corner-tr::after{top:0;right:0}
  .corner-bl { bottom:16px;left:16px;} .corner-bl::before{bottom:0;left:0}.corner-bl::after{bottom:0;left:0}
  .corner-br { bottom:16px;right:16px;}.corner-br::before{bottom:0;right:0}.corner-br::after{bottom:0;right:0}

  /* ── HUD panels ──────────────────────────────────────────────── */
  /* Left column: markets + weather stacked */
  #left-panels {
    position: fixed; top: 56px; left: 20px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 20;
  }
  .hud-panel {
    width: 270px;
    background: rgba(0,20,40,0.75);
    border: 1px solid rgba(0,229,255,0.14);
    padding: 12px 15px 14px;
    backdrop-filter: blur(2px);
    position: relative;
  }
  .hud-panel::before {
    content:''; position:absolute; top:0; width:18px; height:18px;
    border-color: var(--c); border-style: solid; opacity: 0.5;
  }
  #market-panel::before { left:0;  border-width:2px 0 0 2px; }
  #weather-panel::before{ left:0;  border-width:2px 0 0 2px; }
  #news-panel { position: fixed; top: 56px; right: 20px; width: 270px;
    background: rgba(0,20,40,0.75); border: 1px solid rgba(0,229,255,0.14);
    padding: 12px 15px 14px; backdrop-filter: blur(2px); z-index: 20; }
  #news-panel::before { right:0; border-width:2px 2px 0 0; }

  .hud-panel-title {
    font-size: 8px; letter-spacing: 4px; color: var(--c); opacity: 0.6;
    margin-bottom: 11px; border-bottom: 1px solid rgba(0,229,255,0.1);
    padding-bottom: 7px; display: flex; align-items: center; gap: 7px;
  }
  .hud-panel-title::before {
    content:''; display:inline-block; width:5px; height:5px;
    background:var(--c); opacity:0.8; border-radius:50%;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

  /* Market */
  .market-asset { margin-bottom: 9px; }
  .market-asset:last-child { margin-bottom: 0; }
  .market-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
  .market-sym   { font-size:10px; color:var(--c); opacity:0.85; min-width:40px; letter-spacing:1px; }
  .market-price { font-size:11px; color:#c8eeff; flex:1; text-align:right; }
  .market-chg   { font-size:10px; min-width:54px; text-align:right; }
  .market-chg.pos { color: var(--speak); }
  .market-chg.neg { color: var(--rec); }
  .spark-canvas { display:block; width:100%; height:28px; opacity:0.85; }

  /* News */
  .news-item {
    padding: 5px 0; border-bottom: 1px solid rgba(0,229,255,0.07);
    font-size: 9.5px; line-height: 1.45; color: rgba(120,180,210,0.75);
  }
  .news-item:last-child { border-bottom: none; }
  .news-bullet { color:var(--c); opacity:0.45; margin-right:5px; }
  .panel-loading { font-size:9px; letter-spacing:2px; color:rgba(0,229,255,0.2); }

  /* Weather */
  .wx-current { display:flex; align-items:center; gap:12px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid rgba(0,229,255,0.08); }
  .wx-icon    { font-size:28px; line-height:1; }
  .wx-temp    { font-size:26px; color:#c8eeff; letter-spacing:-1px; }
  .wx-temp sup{ font-size:12px; vertical-align:super; color:var(--c); opacity:0.7; }
  .wx-desc    { font-size:9px; color:rgba(0,229,255,0.55); letter-spacing:1px; margin-top:2px; }
  .wx-meta    { font-size:9px; color:rgba(120,180,210,0.5); letter-spacing:1px; margin-top:3px; }
  .wx-forecast{ display:flex; gap:6px; }
  .wx-day     { flex:1; text-align:center; padding:5px 4px; border:1px solid rgba(0,229,255,0.08); background:rgba(0,229,255,0.03); }
  .wx-day-name{ font-size:8px; color:rgba(0,229,255,0.5); letter-spacing:1px; margin-bottom:3px; }
  .wx-day-icon{ font-size:16px; line-height:1.3; }
  .wx-day-tmp { font-size:9px; color:#c8eeff; margin-top:3px; }
  .wx-day-tmp span{ color:rgba(120,180,210,0.45); }

  /* ── Main layout ─────────────────────────────────────────────── */
  #main {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; padding: 46px 0 38px;
    gap: 4px;
  }

  /* ── Orb ─────────────────────────────────────────────────────── */
  #orb-wrap {
    position: relative; width: 280px; height: 280px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin-bottom: 6px;
  }
  .chev { position:absolute; width:16px; height:16px; border-color:var(--c); border-style:solid; opacity:0.3; }
  .chev-tl{top:20px;left:20px;border-width:2px 0 0 2px}
  .chev-tr{top:20px;right:20px;border-width:2px 2px 0 0}
  .chev-bl{bottom:20px;left:20px;border-width:0 0 2px 2px}
  .chev-br{bottom:20px;right:20px;border-width:0 2px 2px 0}

  #orb-canvas { display:block; width:240px; height:240px; }

  /* ── Status ──────────────────────────────────────────────────── */
  #status-wrap { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .sbar { width:30px; height:1px; background:var(--c); opacity:0.35; }
  #status {
    font-size: 10px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--c); min-width: 190px; text-align: center;
    text-shadow: 0 0 12px rgba(0,229,255,0.45);
    transition: color 0.3s;
  }
  body.recording #status { color:var(--rec); text-shadow:0 0 12px rgba(255,34,51,0.6); }
  body.thinking  #status { color:var(--think); text-shadow:0 0 12px rgba(255,170,0,0.6); }
  body.speaking  #status { color:var(--speak); text-shadow:0 0 12px rgba(0,255,153,0.6); }

  /* ── Heard / response ────────────────────────────────────────── */
  #heard {
    font-size:12px; color:rgba(120,180,210,0.45); font-style:italic;
    min-height:18px; max-width:520px; text-align:center; padding:0 20px;
    margin-bottom:14px;
  }
  #resp-wrap {
    position: relative; min-height: 80px; max-width: 620px; width: 100%;
    padding: 13px 22px; background: rgba(0,20,40,0.7);
    border: 1px solid rgba(0,229,255,0.1);
    border-top: 2px solid rgba(0,229,255,0.3);
  }
  #resp-wrap::before {
    content:'GAIA'; position:absolute; top:-8px; left:14px;
    font-size:7px; letter-spacing:4px; color:var(--c); opacity:0.5;
    background:#020c18; padding:0 7px;
  }
  #resp { font-size:14px; color:#c8eeff; line-height:1.9; white-space:pre-wrap; }
  #cursor {
    display:inline-block; width:7px; height:14px; background:var(--c);
    margin-left:2px; vertical-align:middle; opacity:0;
    animation: cblink 0.65s step-end infinite;
  }
  #cursor.active { opacity:1; }
  @keyframes cblink { 0%,100%{opacity:0} 50%{opacity:1} }

  /* ── Bottom bar ──────────────────────────────────────────────── */
  #bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-top: 1px solid rgba(0,229,255,0.08);
    background: linear-gradient(0deg, rgba(0,20,40,0.6) 0%, transparent 100%);
    z-index: 20;
  }
  #hint { font-size:8px; letter-spacing:4px; text-transform:uppercase; color:rgba(0,229,255,0.18); }

  /* System gauges panel */
  #sys-panel {
    position: fixed; bottom: 46px; right: 20px;
    width: 270px;
    background: rgba(0,20,40,0.75);
    border: 1px solid rgba(0,229,255,0.14);
    padding: 12px 15px 14px;
    backdrop-filter: blur(2px);
    z-index: 20;
  }
  #sys-panel::before {
    content:''; position:absolute; top:0; right:0;
    width:18px; height:18px;
    border-color: var(--c); border-style:solid; opacity:0.5;
    border-width:2px 2px 0 0;
  }
  #gauge-canvas { display:block; width:100%; }
  .sys-net {
    display:flex; justify-content:space-between;
    margin-top:8px; font-size:9px; letter-spacing:1px;
    color:rgba(0,229,255,0.45);
    border-top:1px solid rgba(0,229,255,0.08); padding-top:7px;
  }
  .sys-net span { color:#c8eeff; }

  /* ── Boot overlay ────────────────────────────────────────────── */
  #boot {
    position: fixed; inset: 0; background: #020c18;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999; cursor: pointer;
  }
  #boot-orb {
    width: 160px; height: 160px; border-radius: 50%; margin-bottom: 40px;
    background: radial-gradient(circle at 40% 35%, #00e5ff 0%, #0055aa 45%, #001a44 100%);
    box-shadow: 0 0 80px rgba(0,229,255,0.5), 0 0 160px rgba(0,100,200,0.2);
    animation: breathe 2.5s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  #boot h1 { font-size:26px; letter-spacing:14px; color:var(--c); text-shadow:0 0 24px rgba(0,229,255,0.6); margin-bottom:14px; }
  #boot-sub { font-size:9px; letter-spacing:5px; color:rgba(0,229,255,0.28); text-transform:uppercase; }
</style>
</head>
<body>

<div id="atmo"></div>
<div id="scanlines"></div>
<canvas id="lines-canvas"></canvas>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div id="topbar">
  <div id="logo">GAIA</div>
  <div id="topbar-mid">NEURAL INTERFACE  //  SYSTEM ONLINE</div>
  <div id="topbar-right">
    <div id="clock">00:00:00</div>
    <div id="datestr">0000-00-00</div>
  </div>
</div>

<!-- Left column -->
<div id="left-panels">
  <div class="hud-panel" id="market-panel">
    <div class="hud-panel-title">MARKETS</div>
    <div id="market-rows"><div class="panel-loading">LADDAR...</div></div>
  </div>
  <div class="hud-panel" id="weather-panel">
    <div class="hud-panel-title">VÄDER  //  VASA · ÖSTERBOTTEN</div>
    <div id="weather-content"><div class="panel-loading">LADDAR...</div></div>
  </div>
</div>

<!-- News panel -->
<div id="news-panel">
  <div class="hud-panel-title">HEADLINES</div>
  <div id="news-list"><div class="panel-loading">LADDAR...</div></div>
</div>

<!-- System gauges panel -->
<div id="sys-panel">
  <div class="hud-panel-title">SYSTEM</div>
  <canvas id="gauge-canvas" width="240" height="72"></canvas>
  <div class="sys-net">
    <div>↑ <span id="net-up">0</span> KB/S</div>
    <div>↓ <span id="net-down">0</span> KB/S</div>
    <div>DISK <span id="disk-pct">0</span>%</div>
  </div>
</div>

<div id="main">
  <div id="orb-wrap" onclick="handleTrigger()" title="Klicka eller tryck Mellanslag">
    <div class="chev chev-tl"></div>
    <div class="chev chev-tr"></div>
    <div class="chev chev-bl"></div>
    <div class="chev chev-br"></div>
    <canvas id="orb-canvas" width="240" height="240"></canvas>
  </div>

  <div id="status-wrap">
    <div class="sbar"></div>
    <div id="status">REDO</div>
    <div class="sbar"></div>
  </div>

  <div id="heard"></div>

  <div id="resp-wrap">
    <div id="resp"></div><span id="cursor"></span>
  </div>
</div>

<div id="bottombar">
  <div id="hint">MELLANSLAG — TALA  ·  ESC — AVBRYT</div>
</div>

<div id="boot" onclick="boot()">
  <div id="boot-orb"></div>
  <h1>GAIA</h1>
  <div id="boot-sub">klicka för att ansluta</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────────
let socket = null, busy = false, orbState = 'idle';

// ── Clock ──────────────────────────────────────────────────────────────────────
const clockEl = document.getElementById('clock');
const dateEl  = document.getElementById('datestr');
function updateClock() {
  const n = new Date();
  clockEl.textContent = [n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  dateEl.textContent  = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
setInterval(updateClock, 1000); updateClock();

// ── Arc reactor orb ────────────────────────────────────────────────────────────
const orbCanvas = document.getElementById('orb-canvas');
const oc = orbCanvas.getContext('2d');
const CX = orbCanvas.width / 2, CY = orbCanvas.height / 2;

const COLORS = {
  idle:      ['#00ccff','#0066cc','#001a44','#00e5ff'],
  recording: ['#ff4455','#aa0011','#330008','#ff2233'],
  thinking:  ['#ffcc33','#cc7700','#332200','#ffaa00'],
  speaking:  ['#33ffbb','#00bb66','#003322','#00ff99'],
};

let anim = null, aTime = 0;

let waveformBuf = new Float32Array(64).fill(0);

function updateWaveform(t) {
  for (let i = 0; i < 64; i++) {
    const angle = (i / 64) * Math.PI * 2;
    let target;
    if (orbState === 'recording') {
      target = Math.random() * 11 + 1;
    } else if (orbState === 'speaking') {
      target = 4 + Math.sin(angle * 7 + t * 9) * 4 + Math.random() * 2.5;
    } else if (orbState === 'thinking') {
      target = 2 + Math.sin(angle * 3 + t * 1.8) * 2;
    } else {
      target = 0.8 + Math.sin(angle * 5 + t * 0.7) * 0.6;
    }
    const smooth = orbState === 'recording' ? 0.5 : 0.88;
    waveformBuf[i] = waveformBuf[i] * smooth + target * (1 - smooth);
  }
}

function drawWaveformRing(t) {
  updateWaveform(t);
  const col = COLORS[orbState] || COLORS.idle;
  const glow = col[3];
  for (let i = 0; i < 64; i++) {
    const angle = (i / 64) * Math.PI * 2 - Math.PI / 2;
    const amp = waveformBuf[i];
    const x1 = CX + Math.cos(angle) * 106;
    const y1 = CY + Math.sin(angle) * 106;
    const x2 = CX + Math.cos(angle) * (106 + amp);
    const y2 = CY + Math.sin(angle) * (106 + amp);
    oc.beginPath(); oc.moveTo(x1, y1); oc.lineTo(x2, y2);
    oc.strokeStyle = hex4(glow, Math.min(0.9, 0.4 + amp / 14));
    oc.lineWidth = 1.5; oc.stroke();
  }
}

function drawReactor(t) {
  const [core, mid, edge, glow] = COLORS[orbState] || COLORS.idle;
  oc.clearRect(0, 0, orbCanvas.width, orbCanvas.height);

  const pulse = 1 + Math.sin(t * 1.2) * 0.04;

  // ── outer atmospheric glow ──
  const ag = oc.createRadialGradient(CX,CY,80,CX,CY,118*pulse);
  ag.addColorStop(0, hex4(glow,0.18)); ag.addColorStop(1, hex4(glow,0));
  oc.beginPath(); oc.arc(CX,CY,118*pulse,0,Math.PI*2); oc.fillStyle=ag; oc.fill();

  // ── outermost spinning dashed ring ──
  oc.save(); oc.translate(CX,CY); oc.rotate(t*0.18);
  oc.setLineDash([8,6]);
  oc.beginPath(); oc.arc(0,0,100,0,Math.PI*2);
  oc.strokeStyle=hex4(glow,0.25); oc.lineWidth=1; oc.stroke();
  oc.setLineDash([]); oc.restore();

  // ── outer ring ──
  oc.beginPath(); oc.arc(CX,CY,88,0,Math.PI*2);
  oc.strokeStyle=hex4(glow,0.35); oc.lineWidth=1.5; oc.stroke();

  // ── triangle segments (arc reactor style) ──
  const segs = 8;
  for (let i=0; i<segs; i++) {
    const a = (i/segs)*Math.PI*2 + t*0.08;
    oc.save(); oc.translate(CX,CY); oc.rotate(a);
    oc.beginPath();
    oc.moveTo(62,-7); oc.lineTo(80,0); oc.lineTo(62,7); oc.closePath();
    oc.fillStyle = hex4(core, 0.65);
    oc.fill();
    oc.restore();
  }

  // ── middle ring ──
  oc.beginPath(); oc.arc(CX,CY,60,0,Math.PI*2);
  oc.strokeStyle=hex4(core,0.7); oc.lineWidth=2; oc.stroke();

  // ── inner ring (counter-rotate) ──
  oc.save(); oc.translate(CX,CY); oc.rotate(-t*0.35);
  oc.setLineDash([5,5]);
  oc.beginPath(); oc.arc(0,0,46,0,Math.PI*2);
  oc.strokeStyle=hex4(glow,0.6); oc.lineWidth=1.5; oc.stroke();
  oc.setLineDash([]); oc.restore();

  // ── state-specific wave rings ──
  if (orbState==='recording' || orbState==='speaking') {
    const count = orbState==='recording' ? 3 : 4;
    const speed = orbState==='recording' ? 1.6 : 2.0;
    for (let i=0;i<count;i++) {
      const ph = (t*speed + i*0.5) % (Math.PI*2);
      const pr = ph/(Math.PI*2);
      const wr = 60 + pr*58;
      oc.beginPath(); oc.arc(CX,CY,wr,0,Math.PI*2);
      oc.strokeStyle=hex4(glow,(1-pr)*0.5);
      oc.lineWidth=(1-pr)*2.5+0.3; oc.stroke();
    }
  }
  if (orbState==='thinking') {
    oc.save(); oc.translate(CX,CY); oc.rotate(t*2.5);
    oc.setLineDash([10,8]);
    oc.beginPath(); oc.arc(0,0,72,0,Math.PI*2);
    oc.strokeStyle=hex4(glow,0.6); oc.lineWidth=2; oc.stroke();
    oc.setLineDash([]); oc.restore();
  }

  // ── inner sphere gradient ──
  const sg = oc.createRadialGradient(CX-14,CY-16,2,CX,CY,40);
  sg.addColorStop(0, lighten(core,0.5));
  sg.addColorStop(0.5, core);
  sg.addColorStop(0.85, mid);
  sg.addColorStop(1, edge);
  oc.beginPath(); oc.arc(CX,CY,40,0,Math.PI*2); oc.fillStyle=sg; oc.fill();

  // ── inner glow fill ──
  const ig = oc.createRadialGradient(CX,CY,0,CX,CY,38);
  ig.addColorStop(0,hex4(glow,0.5)); ig.addColorStop(1,hex4(glow,0));
  oc.beginPath(); oc.arc(CX,CY,38,0,Math.PI*2); oc.fillStyle=ig; oc.fill();

  // ── center bright spot ──
  const cg = oc.createRadialGradient(CX,CY,0,CX,CY,18);
  cg.addColorStop(0,'rgba(255,255,255,0.98)');
  cg.addColorStop(0.35, hex4(glow,0.9));
  cg.addColorStop(1, hex4(glow,0));
  oc.beginPath(); oc.arc(CX,CY,18,0,Math.PI*2); oc.fillStyle=cg; oc.fill();

  drawWaveformRing(t);
}

function animLoop(ts) {
  aTime = ts/1000;
  drawReactor(aTime);
  anim = requestAnimationFrame(animLoop);
}

// ── Connecting lines canvas ────────────────────────────────────────────────────
const linesCanvas = document.getElementById('lines-canvas');
const lc = linesCanvas.getContext('2d');
let linePhase = 0;

function drawLines(t) {
  const W = linesCanvas.width, H = linesCanvas.height;
  lc.clearRect(0,0,W,H);

  const orbWrap = document.getElementById('orb-wrap');
  if (!orbWrap) return;
  const or = orbWrap.getBoundingClientRect();
  const ox = or.left + or.width/2, oy = or.top + or.height/2;

  const mP = document.getElementById('market-panel');
  const nP = document.getElementById('news-panel');
  if (!mP || !nP) return;

  const mr = mP.getBoundingClientRect();
  const nr = nP.getBoundingClientRect();

  // Market panel: line from orb to right edge of panel (midpoint)
  const m1x = mr.right, m1y = mr.top + mr.height/2;
  // News panel: line from orb to left edge of panel (midpoint)
  const n1x = nr.left,  n1y = nr.top  + nr.height/2;

  const dash = (t * 40) % 24;

  [[ox,oy,m1x,m1y],[ox,oy,n1x,n1y]].forEach(([x1,y1,x2,y2]) => {
    lc.save();
    lc.setLineDash([6,10]);
    lc.lineDashOffset = -dash;
    lc.beginPath(); lc.moveTo(x1,y1); lc.lineTo(x2,y2);
    lc.strokeStyle = 'rgba(0,200,255,0.18)';
    lc.lineWidth = 1;
    lc.stroke();
    // dot at panel end
    lc.setLineDash([]);
    lc.beginPath(); lc.arc(x2,y2,3,0,Math.PI*2);
    lc.fillStyle = 'rgba(0,229,255,0.4)'; lc.fill();
    lc.restore();
  });
}

function linesLoop(ts) {
  drawLines(ts/1000);
  requestAnimationFrame(linesLoop);
}

function resizeLines() {
  linesCanvas.width  = window.innerWidth;
  linesCanvas.height = window.innerHeight;
}

// ── Typewriter ─────────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
const heardEl  = document.getElementById('heard');
const respEl   = document.getElementById('resp');
const cursorEl = document.getElementById('cursor');
let twTimer=null, twQ='', twI=0;

const _GLYPHS = '01アイウエオカキクケコ#$%@&*<>?/\\|ABCDEF0123456789';

function decryptStart(text) {
  if (twTimer) clearInterval(twTimer);
  respEl.textContent = ''; cursorEl.classList.add('active');
  const dur = Math.max(600, Math.min(1800, text.length * 22));
  const start = Date.now();

  twTimer = setInterval(() => {
    const progress = Math.min((Date.now() - start) / dur, 1);
    let out = '';
    for (let i = 0; i < text.length; i++) {
      const cp = (progress - (i / text.length) * 0.45) / 0.55;
      if (text[i] === ' ' || text[i] === '\n' || cp >= 1) {
        out += text[i];
      } else if (cp > 0) {
        out += _GLYPHS[Math.floor(Math.random() * _GLYPHS.length)];
      } else {
        out += '·';
      }
    }
    respEl.textContent = out;
    if (progress >= 1) {
      respEl.textContent = text;
      clearInterval(twTimer); twTimer = null;
      cursorEl.classList.remove('active');
    }
  }, 40);
}

// ── State machine ──────────────────────────────────────────────────────────────
function applyState(data) {
  const state  = data.state||'idle';
  orbState = state;
  document.body.className = state;
  statusEl.textContent = data.status || {idle:'REDO',recording:'LYSSNAR...',thinking:'TÄNKER...',speaking:'TALAR'}[state]||state.toUpperCase();
  if (data.heard!=null) heardEl.textContent = data.heard ? `"${data.heard}"` : '';
  if (data.text!=null)  decryptStart(data.text);
  if (state==='idle') {
    busy=false;
    if (data.text==null && data.heard==null) {
      heardEl.textContent='';
      if (twTimer){clearInterval(twTimer);twTimer=null;}
      respEl.textContent=''; cursorEl.classList.remove('active');
    }
  }
}

// ── Trigger ────────────────────────────────────────────────────────────────────
function handleTrigger() {
  if (busy) return;
  if (!socket||!socket.connected) { statusEl.textContent='EJ ANSLUTEN'; return; }
  busy=true;
  statusEl.textContent='AKTIVERAR...';
  socket.emit('trigger');
}

function handleStop() {
  if (!socket||!socket.connected) return;
  socket.emit('stop');
  busy = false;
  orbState = 'idle';
  document.body.className = 'idle';
  statusEl.textContent = 'AVBRUTEN';
  setTimeout(() => { if (statusEl.textContent === 'AVBRUTEN') statusEl.textContent = 'REDO'; }, 2000);
}

// ── Markets ────────────────────────────────────────────────────────────────────
const MMETA = {
  'BTC-USD':{label:'BTC', fmt:p=>'$'+Math.round(p).toLocaleString('en-US'), color:'#f7931a'},
  'ETH-USD':{label:'ETH', fmt:p=>'$'+Math.round(p).toLocaleString('en-US'), color:'#627eea'},
  'SPY':    {label:'S&P', fmt:p=>'$'+p.toFixed(2),                          color:'#00e5ff'},
  'GC=F':   {label:'GOLD',fmt:p=>'$'+Math.round(p).toLocaleString('en-US')+'/oz',color:'#ffd700'},
};

function drawSparkline(canvas, data, color) {
  if (!data||data.length<2) return;
  const w=canvas.width, h=canvas.height, ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||1;
  const pts=data.map((v,i)=>({x:(i/(data.length-1))*w, y:h-2-((v-mn)/rng)*(h-4)}));
  const grd=ctx.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,color+'66'); grd.addColorStop(1,color+'00');
  ctx.beginPath(); pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle=grd; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
}

async function loadMarkets() {
  try {
    const data=await(await fetch('/api/prices')).json();
    const order=['BTC-USD','ETH-USD','SPY','GC=F'];
    document.getElementById('market-rows').innerHTML=order.map(sym=>{
      const d=data[sym]; if(!d) return '';
      const m=MMETA[sym], chg=d.change_pct, cls=chg>=0?'pos':'neg', sign=chg>=0?'+':'';
      return `<div class="market-asset" data-sym="${sym}">
        <div class="market-row">
          <span class="market-sym">${m.label}</span>
          <span class="market-price">${m.fmt(d.price)}</span>
          <span class="market-chg ${cls}">${sign}${chg.toFixed(2)}%</span>
        </div>
        <canvas class="spark-canvas" id="sp-${sym.replace('=','-')}" width="238" height="28"></canvas>
      </div>`;
    }).join('')||'<div class="panel-loading">EJ TILLGÄNGLIG</div>';
    order.forEach(sym=>{
      const d=data[sym]; if(!d?.sparkline) return;
      const cv=document.getElementById('sp-'+sym.replace('=','-'));
      if(cv) drawSparkline(cv,d.sparkline,MMETA[sym].color);
    });
  } catch(e) { document.getElementById('market-rows').innerHTML='<div class="panel-loading">EJ TILLGÄNGLIG</div>'; }
}

async function loadNews() {
  try {
    const data=await(await fetch('/api/news')).json();
    document.getElementById('news-list').innerHTML=(data.headlines||[])
      .map(h=>`<div class="news-item"><span class="news-bullet">›</span>${h}</div>`).join('')
      ||'<div class="panel-loading">EJ TILLGÄNGLIG</div>';
  } catch(e) { document.getElementById('news-list').innerHTML='<div class="panel-loading">EJ TILLGÄNGLIG</div>'; }
}

// ── Weather ────────────────────────────────────────────────────────────────────
async function loadWeather() {
  try {
    const d = await (await fetch('/api/weather')).json();
    if (!d.temp && d.temp !== 0) { document.getElementById('weather-content').innerHTML='<div class="panel-loading">EJ TILLGÄNGLIG</div>'; return; }
    const fc = (d.forecast||[]).slice(0,4).map(f=>
      `<div class="wx-day">
        <div class="wx-day-name">${f.day}</div>
        <div class="wx-day-icon">${f.icon}</div>
        <div class="wx-day-tmp">${f.max}° <span>${f.min}°</span></div>
      </div>`
    ).join('');
    document.getElementById('weather-content').innerHTML=`
      <div class="wx-current">
        <div class="wx-icon">${d.icon}</div>
        <div>
          <div class="wx-temp">${d.temp}<sup>°C</sup></div>
          <div class="wx-desc">${d.desc.toUpperCase()}</div>
          <div class="wx-meta">VIND ${d.wind} M/S  ·  LUFTFUKT ${d.humidity}%</div>
        </div>
      </div>
      <div class="wx-forecast">${fc}</div>`;
  } catch(e) { document.getElementById('weather-content').innerHTML='<div class="panel-loading">EJ TILLGÄNGLIG</div>'; }
}

// ── System gauges ──────────────────────────────────────────────────────────────
const gaugeCanvas = document.getElementById('gauge-canvas');

function drawArcGauge(ctx, cx, cy, r, value, color, label, unit) {
  const startA = Math.PI * 0.75, sweep = Math.PI * 1.5;
  // Track
  ctx.beginPath(); ctx.arc(cx, cy, r, startA, startA + sweep);
  ctx.strokeStyle = 'rgba(0,229,255,0.08)'; ctx.lineWidth = 7; ctx.stroke();
  // Fill
  const endA = startA + (value / 100) * sweep;
  ctx.beginPath(); ctx.arc(cx, cy, r, startA, endA);
  ctx.strokeStyle = color; ctx.lineWidth = 7;
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.shadowBlur = 0;
  // Value text
  ctx.fillStyle = '#c8eeff'; ctx.textAlign = 'center';
  ctx.font = 'bold 13px Courier New';
  ctx.fillText(Math.round(value) + unit, cx, cy + 5);
  // Label
  ctx.fillStyle = 'rgba(0,229,255,0.4)';
  ctx.font = '7px Courier New';
  ctx.letterSpacing = '2px';
  ctx.fillText(label, cx, cy + 20);
}

function renderGauges(cpu, ram) {
  if (!gaugeCanvas) return;
  const ctx = gaugeCanvas.getContext('2d');
  ctx.clearRect(0, 0, gaugeCanvas.width, gaugeCanvas.height);
  const cpuColor  = cpu  > 80 ? '#ff4455' : cpu  > 60 ? '#ffaa00' : '#00e5ff';
  const ramColor  = ram  > 80 ? '#ff4455' : ram  > 60 ? '#ffaa00' : '#00cc88';
  drawArcGauge(ctx,  50, 44, 32, cpu, cpuColor,  'CPU',  '%');
  drawArcGauge(ctx, 140, 44, 32, ram, ramColor,  'RAM',  '%');
}

async function loadSystem() {
  try {
    const d = await (await fetch('/api/system')).json();
    renderGauges(d.cpu ?? 0, d.ram ?? 0);
    const nu = document.getElementById('net-up');
    const nd = document.getElementById('net-down');
    const dp = document.getElementById('disk-pct');
    if (nu) nu.textContent = d.net_up  ?? 0;
    if (nd) nd.textContent = d.net_down ?? 0;
    if (dp) dp.textContent = d.disk    ?? 0;
  } catch(e) {}
}

// ── Color utils ────────────────────────────────────────────────────────────────
function hex4(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function lighten(hex, amt) {
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,Math.round(r+(255-r)*amt))},${Math.min(255,Math.round(g+(255-g)*amt))},${Math.min(255,Math.round(b+(255-b)*amt))})`;
}

// ── Boot ───────────────────────────────────────────────────────────────────────
let booted = false;

function boot() {
  if (booted) return;
  booted = true;
  document.getElementById('boot').style.display='none';
  resizeLines();
  window.addEventListener('resize', resizeLines);

  socket=io({transports:['websocket','polling']});
  socket.on('connect',    ()=>applyState({state:'idle',status:'ANSLUTEN'}));
  socket.on('disconnect', ()=>{ busy=false; statusEl.textContent='ÅTERANSLUTER...'; });
  socket.on('state',      data=>{ applyState(data); if(data.state&&data.state!=='idle') busy=true; });

  if(anim) cancelAnimationFrame(anim);
  requestAnimationFrame(animLoop);
  requestAnimationFrame(linesLoop);

  loadMarkets(); loadNews(); loadWeather();
  setInterval(loadMarkets,  60000);
  setInterval(loadNews,    300000);
  setInterval(loadWeather, 600000);
  loadSystem();
  setInterval(loadSystem, 3000);
}

// Global keydown — works before and after boot
document.addEventListener('keydown', e=>{
  if (e.code==='Space' && !e.repeat) {
    e.preventDefault();
    if (!booted) { boot(); return; }
    handleTrigger();
  }
  if (e.code==='Escape') { e.preventDefault(); handleStop(); }
});
</script>
