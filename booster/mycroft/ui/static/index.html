<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mycroft</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#080810; color:#ddd;
    font-family:'Courier New',monospace;
    height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    user-select:none; overflow:hidden;
  }
  #orb {
    width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%,#1a6fff,#001a88);
    box-shadow:0 0 30px #1a6fff44;
    margin-bottom:40px; cursor:pointer;
    transition:all 0.15s ease;
  }
  #orb:active,
  #orb.listening { transform:scale(1.12); box-shadow:0 0 80px #1a6fffbb; }
  #orb.thinking  { background:radial-gradient(circle at 38% 35%,#ffaa00,#aa5500); box-shadow:0 0 60px #ffaa0099; animation:pulse 0.9s ease-in-out infinite; }
  #orb.speaking  { background:radial-gradient(circle at 38% 35%,#00dd77,#004422); box-shadow:0 0 60px #00dd7788; }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  #status { font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#4a9eff; height:20px; margin-bottom:16px; }
  #heard  { font-size:14px; color:#556; font-style:italic; min-height:20px; margin-bottom:28px; max-width:560px; text-align:center; }
  #resp   { font-size:16px; color:#ccc; max-width:640px; text-align:center; line-height:1.8; min-height:80px; padding:0 28px; }
  #hint   { position:fixed; bottom:24px; font-size:11px; color:#222; letter-spacing:2px; text-transform:uppercase; }
  #err    { position:fixed; top:18px; background:#1a0000; color:#ff5555; border:1px solid #550000; padding:10px 22px; border-radius:6px; font-size:12px; display:none; max-width:500px; text-align:center; }

  #start {
    position:fixed; inset:0; background:#080810;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; z-index:99;
  }
  #start-orb { width:130px; height:130px; border-radius:50%; background:radial-gradient(circle at 38% 35%,#1a6fff,#001a88); box-shadow:0 0 50px #1a6fff66; margin-bottom:32px; animation:breathe 2s ease-in-out infinite; }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #start h1 { font-size:30px; letter-spacing:10px; color:#4a9eff; margin-bottom:14px; }
  #start p  { font-size:12px; color:#333; letter-spacing:3px; text-transform:uppercase; }
</style>
</head>
<body>

<div id="start" onclick="boot()">
  <div id="start-orb"></div>
  <h1>MYCROFT</h1>
  <p>Click to start</p>
</div>

<div id="err"></div>
<div id="orb" onclick="activate()"></div>
<div id="status">READY</div>
<div id="heard"></div>
<div id="resp"></div>
<div id="hint">CLICK ORB OR PRESS SPACE TO SPEAK</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const orbEl    = document.getElementById('orb');
const statusEl = document.getElementById('status');
const heardEl  = document.getElementById('heard');
const respEl   = document.getElementById('resp');
const errEl    = document.getElementById('err');

let socket, voices = [], busy = false;

// ── Boot ──────────────────────────────────────────────────────────
function boot() {
  document.getElementById('start').style.display = 'none';

  voices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };

  socket = io('http://localhost:5050', {
    transports: ['websocket', 'polling'],
    reconnectionAttempts: 20,
  });

  socket.on('connect',    () => setUI('idle',  'READY'));
  socket.on('disconnect', () => setUI('idle',  'RECONNECTING...'));

  // Python recorded and transcribed — show what was heard, then send as command
  socket.on('transcript', (data) => {
    const text = (data.text || '').trim();
    if (!text) {
      busy = false;
      setUI('idle', 'READY');
      heardEl.textContent = '';
      return;
    }
    heardEl.textContent = '"' + text + '"';
    setUI('thinking', 'THINKING');
    socket.emit('command', { text });
  });

  socket.on('listen_error', (data) => {
    showErr(data.message);
    busy = false;
    setUI('idle', 'READY');
  });

  socket.on('response', (data) => {
    respEl.textContent = data.text;
    setUI('speaking', 'SPEAKING');
    if (data.audio) {
      playAudio(data.audio, () => { busy = false; setUI('idle', 'READY'); });
    } else {
      // fallback to browser TTS if server couldn't generate audio
      speak(data.text, () => { busy = false; setUI('idle', 'READY'); });
    }
  });

  socket.on('error', (data) => {
    showErr(data.message);
    busy = false;
    setUI('idle', 'READY');
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !busy) { e.preventDefault(); activate(); }
  });

  setUI('idle', 'READY');
}

// ── Activate: tell Python to start recording ──────────────────────
function activate() {
  if (busy || !socket || !socket.connected) return;
  busy = true;
  heardEl.textContent = '';
  respEl.textContent  = '';
  setUI('listening', 'LISTENING...');
  socket.emit('start_listen');
}

// ── Play base64 MP3 from server ───────────────────────────────────
function playAudio(b64, onDone) {
  const audio = new Audio('data:audio/mp3;base64,' + b64);
  audio.onended = onDone;
  audio.onerror = () => onDone && onDone();
  audio.play().catch(() => onDone && onDone());
}

// ── Browser TTS fallback ──────────────────────────────────────────
function speak(text, onDone) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'sv-SE';
  utt.rate  = 1.0;
  utt.pitch = 0.85;
  const v = voices.find(v => v.lang.startsWith('sv'))
         || voices.find(v => v.lang.startsWith('en-US'))
         || voices.find(v => v.lang.startsWith('en'));
  if (v) utt.voice = v;
  utt.onend   = onDone;
  utt.onerror = onDone;
  speechSynthesis.speak(utt);
}

// ── Helpers ───────────────────────────────────────────────────────
function setUI(cls, msg) {
  orbEl.className      = cls;
  statusEl.textContent = msg;
}
function showErr(msg) {
  errEl.textContent    = msg;
  errEl.style.display  = 'block';
  setTimeout(() => errEl.style.display = 'none', 7000);
}
</script>
</body>
</html>
