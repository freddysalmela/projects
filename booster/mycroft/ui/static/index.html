<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mycroft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080810;
    color: #ddd;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }

  #orb {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #1a6fff, #001a88);
    box-shadow: 0 0 30px #1a6fff44;
    margin-bottom: 40px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #orb:active,
  #orb.listening { transform: scale(1.12); box-shadow: 0 0 80px #1a6fffbb; }
  #orb.thinking  {
    background: radial-gradient(circle at 38% 35%, #ffaa00, #aa5500);
    box-shadow: 0 0 60px #ffaa0099;
    animation: pulse 0.9s ease-in-out infinite;
  }
  #orb.speaking  {
    background: radial-gradient(circle at 38% 35%, #00dd77, #004422);
    box-shadow: 0 0 60px #00dd7788;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.08)} }

  #status {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a9eff;
    height: 20px;
    margin-bottom: 16px;
  }

  #heard {
    font-size: 14px;
    color: #556;
    font-style: italic;
    min-height: 20px;
    margin-bottom: 28px;
    max-width: 560px;
    text-align: center;
  }

  #response {
    font-size: 16px;
    color: #ccc;
    max-width: 640px;
    text-align: center;
    line-height: 1.8;
    min-height: 80px;
    padding: 0 28px;
  }

  #hint {
    position: fixed;
    bottom: 24px;
    font-size: 11px;
    color: #222;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #err {
    position: fixed;
    top: 18px;
    background: #1a0000;
    color: #ff5555;
    border: 1px solid #550000;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 12px;
    display: none;
    max-width: 500px;
    text-align: center;
  }

  #start {
    position: fixed;
    inset: 0;
    background: #080810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 99;
  }
  #start-orb {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #1a6fff, #001a88);
    box-shadow: 0 0 50px #1a6fff66;
    margin-bottom: 32px;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:scale(1)}50%{transform:scale(1.06)} }
  #start h1 { font-size: 30px; letter-spacing: 10px; color: #4a9eff; margin-bottom: 14px; }
  #start p  { font-size: 12px; color: #333; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>

<div id="start" onclick="boot()">
  <div id="start-orb"></div>
  <h1>MYCROFT</h1>
  <p>Click to start</p>
</div>

<div id="err"></div>
<div id="orb" onclick="activateByClick()"></div>
<div id="status">READY</div>
<div id="heard"></div>
<div id="response"></div>
<div id="hint">CLICK ORB OR PRESS SPACE TO SPEAK</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const orb    = document.getElementById('orb');
const status = document.getElementById('status');
const heard  = document.getElementById('heard');
const resp   = document.getElementById('response');
const err    = document.getElementById('err');

let socket, voices = [], busy = false;

// ── Boot (requires user click first to unlock audio APIs) ──────────
function boot() {
  document.getElementById('start').style.display = 'none';

  // Load TTS voices
  voices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };

  // Connect socket
  socket = io('http://localhost:5050', {
    transports: ['websocket', 'polling'],
    reconnectionAttempts: 20,
  });

  socket.on('connect',    () => setUI('idle', 'READY'));
  socket.on('disconnect', () => setUI('idle', 'RECONNECTING...'));

  socket.on('response', (data) => {
    resp.textContent = data.text;
    setUI('speaking', 'SPEAKING');
    speak(data.text, () => {
      busy = false;
      setUI('idle', 'READY');
    });
  });

  socket.on('error', (data) => {
    showErr(data.message);
    busy = false;
    setUI('idle', 'READY');
  });

  // Spacebar to activate
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !busy) {
      e.preventDefault();
      activate();
    }
  });

  setUI('idle', 'READY');
}

// ── Activation ────────────────────────────────────────────────────
function activateByClick() { if (!busy) activate(); }

function activate() {
  if (busy) return;
  busy = true;
  heard.textContent = '';
  resp.textContent  = '';
  setUI('listening', 'LISTENING');
  listen();
}

// ── Speech recognition ────────────────────────────────────────────
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showErr('Speech recognition not available. Make sure you are using Brave or Chrome.');
    busy = false;
    setUI('idle', 'READY');
    return;
  }

  const rec = new SR();
  rec.lang             = 'en-US';
  rec.interimResults   = true;
  rec.maxAlternatives  = 1;
  rec.continuous       = false;

  let finalText = '';

  rec.onresult = (e) => {
    let interim = '';
    finalText = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim = e.results[i][0].transcript;
    }
    heard.textContent = '"' + (finalText || interim) + '"';
  };

  rec.onspeechend = () => rec.stop();

  rec.onend = () => {
    const text = finalText.trim();
    if (text) {
      sendCommand(text);
    } else {
      busy = false;
      setUI('idle', 'READY');
      heard.textContent = '';
    }
  };

  rec.onerror = (e) => {
    if (e.error === 'not-allowed') {
      showErr('Microphone blocked. Click the lock icon in the Brave address bar and allow microphone.');
    } else if (e.error !== 'no-speech') {
      showErr('Microphone error: ' + e.error);
    }
    busy = false;
    setUI('idle', 'READY');
  };

  rec.start();
}

function sendCommand(text) {
  setUI('thinking', 'THINKING');
  heard.textContent = '"' + text + '"';
  socket.emit('command', { text });
}

// ── TTS ───────────────────────────────────────────────────────────
function speak(text, onDone) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'en-US';
  utt.rate  = 1.0;
  utt.pitch = 0.85;
  const v = voices.find(v => v.lang.startsWith('en') && /david|mark|guy/i.test(v.name))
         || voices.find(v => v.lang.startsWith('en-US'))
         || voices.find(v => v.lang.startsWith('en'));
  if (v) utt.voice = v;
  utt.onend   = onDone;
  utt.onerror = onDone;
  speechSynthesis.speak(utt);
}

// ── UI helpers ────────────────────────────────────────────────────
function setUI(cls, msg) {
  orb.className    = cls;
  status.textContent = msg;
}

function showErr(msg) {
  err.textContent  = msg;
  err.style.display = 'block';
  setTimeout(() => err.style.display = 'none', 7000);
}
</script>
</body>
</html>
