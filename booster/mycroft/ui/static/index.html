<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mycroft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080810;
    color: #ddd;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  #orb {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #1a6fff, #002299);
    box-shadow: 0 0 25px #1a6fff44;
    margin-bottom: 36px;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  #orb.idle     { box-shadow: 0 0 25px #1a6fff44; }
  #orb.waiting  { box-shadow: 0 0 50px #1a6fff99; animation: breathe 2s ease-in-out infinite; }
  #orb.listening{ box-shadow: 0 0 70px #1a6fffcc; transform: scale(1.1); }
  #orb.thinking { background: radial-gradient(circle at 38% 35%, #ffaa00, #aa5500); box-shadow: 0 0 60px #ffaa0099; animation: pulse 0.8s ease-in-out infinite; }
  #orb.speaking { background: radial-gradient(circle at 38% 35%, #00dd77, #005533); box-shadow: 0 0 60px #00dd7788; }

  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  @keyframes pulse   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  #status {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a9eff;
    height: 18px;
    margin-bottom: 18px;
  }

  #heard {
    font-size: 13px;
    color: #555;
    font-style: italic;
    height: 18px;
    margin-bottom: 24px;
    max-width: 520px;
    text-align: center;
  }

  #response {
    font-size: 16px;
    color: #ccc;
    max-width: 600px;
    text-align: center;
    line-height: 1.8;
    min-height: 80px;
    padding: 0 24px;
  }

  #start-screen {
    position: fixed;
    inset: 0;
    background: #080810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
  }

  #start-screen h1 {
    font-size: 28px;
    letter-spacing: 8px;
    color: #4a9eff;
    margin-bottom: 16px;
  }

  #start-screen p {
    font-size: 13px;
    color: #444;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #start-orb {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #1a6fff, #002299);
    box-shadow: 0 0 40px #1a6fff77;
    margin-bottom: 32px;
    animation: breathe 2s ease-in-out infinite;
  }

  #hint {
    position: fixed;
    bottom: 22px;
    font-size: 11px;
    color: #2a2a3a;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #error-box {
    position: fixed;
    top: 18px;
    background: #2a0000;
    color: #ff6666;
    border: 1px solid #660000;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 12px;
    display: none;
    max-width: 500px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Click to start overlay — unlocks browser audio -->
<div id="start-screen" onclick="onStart()">
  <div id="start-orb"></div>
  <h1>MYCROFT</h1>
  <p>Click to activate</p>
</div>

<div id="error-box"></div>
<div id="orb" class="idle"></div>
<div id="status">READY</div>
<div id="heard"></div>
<div id="response"></div>
<div id="hint">SAY "HEY MYCROFT" TO ACTIVATE</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────
const orb      = document.getElementById('orb');
const statusEl = document.getElementById('status');
const heardEl  = document.getElementById('heard');
const respEl   = document.getElementById('response');
const errBox   = document.getElementById('error-box');

let socket;
let recognition;
let cmdRecognition;
let inSession   = false;
let started     = false;
let voices      = [];

// ── Start (requires user click to unlock audio) ────────────────────
function onStart() {
  document.getElementById('start-screen').style.display = 'none';
  started = true;
  initSocket();
  loadVoices();
  startWakeWord();
}

// ── Socket.IO ─────────────────────────────────────────────────────
function initSocket() {
  socket = io('http://localhost:5050', {
    transports: ['websocket', 'polling'],
    reconnectionAttempts: 10,
    reconnectionDelay: 1000,
  });

  socket.on('connect', () => setState('idle', 'READY'));
  socket.on('disconnect', () => setState('idle', 'RECONNECTING...'));

  socket.on('response', (data) => {
    respEl.textContent = data.text;
    setState('speaking', 'SPEAKING');
    speak(data.text, () => {
      inSession = false;
      setState('waiting', 'LISTENING FOR WAKE WORD');
      startWakeWord();
    });
  });

  socket.on('error', (data) => {
    showError(data.message);
    inSession = false;
    setState('waiting', 'LISTENING FOR WAKE WORD');
    startWakeWord();
  });
}

// ── UI helpers ────────────────────────────────────────────────────
function setState(cls, msg) {
  orb.className = cls;
  statusEl.textContent = msg;
}

function showError(msg) {
  errBox.textContent = msg;
  errBox.style.display = 'block';
  setTimeout(() => errBox.style.display = 'none', 6000);
}

// ── TTS ──────────────────────────────────────────────────────────
function loadVoices() {
  voices = speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
  };
}

function speak(text, onDone) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang  = 'en-US';
  utt.rate  = 1.0;
  utt.pitch = 0.85;

  // prefer a deeper male voice
  const preferred = voices.find(v =>
    v.lang.startsWith('en') && (
      v.name.includes('David') ||
      v.name.includes('Mark')  ||
      v.name.includes('Guy')   ||
      v.name.includes('Male')
    )
  ) || voices.find(v => v.lang.startsWith('en'));
  if (preferred) utt.voice = preferred;

  utt.onend   = onDone || (() => {});
  utt.onerror = onDone || (() => {});
  speechSynthesis.speak(utt);
}

// ── Wake word recognition ─────────────────────────────────────────
function startWakeWord() {
  if (!started || inSession) return;
  stopRecognition(recognition);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showError('Speech recognition not available. Use Brave or Chrome.');
    return;
  }

  recognition = new SR();
  recognition.continuous    = true;
  recognition.interimResults = true;
  recognition.lang          = 'en-US';
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    if (inSession) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.toLowerCase();
      if (t.includes('mycroft')) {
        triggerWake();
        return;
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      showError('Microphone blocked. Click the lock icon in the address bar and allow mic access.');
    }
    // 'no-speech' and 'aborted' are normal — ignore them
  };

  // Chrome stops continuous recognition after ~60s — restart it
  recognition.onend = () => {
    if (!inSession && started) {
      setTimeout(startWakeWord, 300);
    }
  };

  recognition.start();
  setState('waiting', 'LISTENING FOR WAKE WORD');
}

function triggerWake() {
  if (inSession) return;
  inSession = true;
  stopRecognition(recognition);
  heardEl.textContent = '';
  respEl.textContent  = '';
  listenForCommand();
}

// ── Command recognition ───────────────────────────────────────────
function listenForCommand() {
  setState('listening', 'LISTENING');

  speak('Yeah?', () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    cmdRecognition = new SR();
    cmdRecognition.lang            = 'en-US';
    cmdRecognition.interimResults  = true;
    cmdRecognition.maxAlternatives = 1;

    let finalText = '';

    cmdRecognition.onresult = (e) => {
      let interim = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalText += e.results[i][0].transcript;
        } else {
          interim = e.results[i][0].transcript;
        }
      }
      heardEl.textContent = '"' + (finalText || interim) + '"';
    };

    cmdRecognition.onspeechend = () => cmdRecognition.stop();

    cmdRecognition.onend = () => {
      const text = finalText.trim();
      if (text) {
        sendCommand(text);
      } else {
        heardEl.textContent = '';
        inSession = false;
        startWakeWord();
      }
    };

    cmdRecognition.onerror = (e) => {
      showError('Mic error during command: ' + e.error);
      inSession = false;
      startWakeWord();
    };

    cmdRecognition.start();
  });
}

function sendCommand(text) {
  setState('thinking', 'THINKING');
  heardEl.textContent = '"' + text + '"';
  socket.emit('command', { text: text });
}

// ── Helpers ───────────────────────────────────────────────────────
function stopRecognition(r) {
  if (r) {
    try { r.abort(); } catch(_) {}
  }
}
</script>
</body>
</html>
